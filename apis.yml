name: Fanbridge
description: FanBridge was an email and SMS marketing platform for musicians, artists,
  bands, and creators, letting them grow and message their fan mailing lists, run
  newsletters, and capture subscribers from shows and social channels. It was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network as a
  stub. Enrichment (2026-07-19) confirmed FanBridge is defunct - it was acquired by
  Kit (formerly ConvertKit) and ceased operations on April 11, 2022, with active
  accounts migrated to the Kit platform. The domain fanbridge.com now 302-redirects
  to kit.com/fanbridge. There is no standalone FanBridge developer API, documentation,
  SDK, or event surface; the developer docs linked from the destination site belong
  to Kit, not FanBridge.
